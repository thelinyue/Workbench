name: 构建 Electron Windows 安装包

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: 构建与发布
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: 安装锁定依赖
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci 失败，退出码：$LASTEXITCODE" }

      - name: 校验版本号
        id: version
        shell: pwsh
        run: |
          $package = Get-Content -Raw -Encoding UTF8 "package.json" | ConvertFrom-Json
          $version = [string]$package.version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "package.json 版本号无效：$version；必须为 X.Y.Z。" }
          if ("${{ github.event_name }}" -eq "push") {
            $tag = "${{ github.ref_name }}"
            if ($tag -notmatch '^v(?<tagVersion>\d+\.\d+\.\d+)$' -or $Matches.tagVersion -ne $version) { throw "发布标签 $tag 与 package.json 版本 $version 不一致。" }
          } else { $tag = "v$version" }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 类型检查
        shell: pwsh
        run: |
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw "TypeScript 类型检查失败，退出码：$LASTEXITCODE" }

      - name: 运行自动化测试
        shell: pwsh
        run: |
          npm test -- --reporter=dot
          if ($LASTEXITCODE -ne 0) { throw "自动化测试失败，退出码：$LASTEXITCODE" }

      - name: 构建 Electron 安装包
        shell: pwsh
        run: |
          npm run package:win
          if ($LASTEXITCODE -ne 0) { throw "Electron Windows 安装包构建失败，退出码：$LASTEXITCODE" }

      - name: 复核构建资产
        id: assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $setupName = "Workbench_v$version.exe"
          $setup = Join-Path $PWD "release\$setupName"
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw "未生成预期的 Electron 安装包：$setup" }
          $publicDirectory = Join-Path $PWD "release-assets"
          New-Item -ItemType Directory -Force -Path $publicDirectory | Out-Null
          Copy-Item -LiteralPath $setup -Destination $publicDirectory -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          "$hash  $setupName" | Out-File -FilePath (Join-Path $publicDirectory "SHA256SUMS.txt") -Encoding utf8
          $publicFiles = @(Get-ChildItem -LiteralPath $publicDirectory -File)
          $actualNames = ($publicFiles.Name | Sort-Object) -join "|"
          $expectedNames = (@("SHA256SUMS.txt", $setupName) | Sort-Object) -join "|"
          if ($publicFiles.Count -ne 2 -or $actualNames -ne $expectedNames) { throw "公开资产目录包含未授权文件。" }
          "setup_name=$setupName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "setup_hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: 上传构建 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Workbench-v${{ steps.version.outputs.version }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: 发布到当前仓库 Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $notes = Join-Path $PWD "distribution\releases\$tag.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw "缺少公开发行说明：$notes" }
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "当前仓库 Release 已存在，拒绝覆盖历史资产：$tag" }
          gh release create $tag `
            "release-assets\${{ steps.assets.outputs.setup_name }}" `
            "release-assets\SHA256SUMS.txt" `
            --repo $env:GITHUB_REPOSITORY `
            --title "Workbench $tag" `
            --notes-file $notes `
            --latest

      - name: 匿名验证当前仓库下载
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $setupName = "${{ steps.assets.outputs.setup_name }}"
          $directory = Join-Path $env:RUNNER_TEMP "anonymous-release-check"
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $setup = Join-Path $directory $setupName
          $checksums = Join-Path $directory "SHA256SUMS.txt"
          curl.exe -L --fail --silent --show-error -o $setup "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$setupName"
          if ($LASTEXITCODE -ne 0) { throw "匿名下载安装包失败，退出码：$LASTEXITCODE" }
          curl.exe -L --fail --silent --show-error -o $checksums "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw "匿名下载校验文件失败，退出码：$LASTEXITCODE" }
          $setupHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup).Hash.ToLowerInvariant()
          $checksumLine = (Get-Content -Raw -Encoding UTF8 $checksums).Trim()
          if ($setupHash -ne "${{ steps.assets.outputs.setup_hash }}" -or $checksumLine -ne "$setupHash  $setupName") { throw "匿名下载的安装包或校验文件与构建产物不一致。" }
