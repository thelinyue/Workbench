name: 发布 LVM 缓存清理工具

on:
  push:
    tags:
      - "lvm-uncache-tool-v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  APPS_REPO: thelinyue/Workbench-Apps

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: 检出工作台源码
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - name: 安装依赖
        shell: pwsh
        run: npm ci
      - name: 校验并构建 LVM 工具
        shell: pwsh
        env:
          HEPHAESTUS_APP_SIGNING_PRIVATE_KEY: ${{ secrets.HEPHAESTUS_APP_SIGNING_PRIVATE_KEY }}
          HEPHAESTUS_APP_SIGNING_KEY_ID: thelinyue-apps-ed25519-2026
        run: |
          npm test -- --reporter=dot
          if ($LASTEXITCODE -ne 0) { throw "工作台和 LVM 工具测试失败。" }
          if ([string]::IsNullOrWhiteSpace($env:HEPHAESTUS_APP_SIGNING_PRIVATE_KEY)) { throw "未配置应用签名私钥 Secret。" }
          npm run build:lvm-uncache-tool
          $release = Get-Content -Raw -Encoding UTF8 "apps/lvm-uncache-tool/dist/release.json" | ConvertFrom-Json
          if (-not $release.signature.signature) { throw "LVM 工具构建产物没有签名。" }
      - name: 发布 ZIP 并更新 Catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.APPS_RELEASES_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) { throw "未配置 APPS_RELEASES_TOKEN。" }
          $manifest = Get-Content -Raw -Encoding UTF8 "apps/lvm-uncache-tool/manifest.json" | ConvertFrom-Json
          $releasePath = "apps/lvm-uncache-tool/dist/release.json"
          $zipName = "lvm-uncache-tool-v$($manifest.version).zip"
          $zipPath = Join-Path $PWD "apps/lvm-uncache-tool/dist/$zipName"
          $localRelease = Get-Content -Raw -Encoding UTF8 $releasePath | ConvertFrom-Json
          $tag = "lvm-uncache-tool-v$($manifest.version)"
          gh release view $tag --repo $env:APPS_REPO --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            $existingReleaseDirectory = Join-Path $env:RUNNER_TEMP "lvm-existing-release"
            New-Item -ItemType Directory -Force $existingReleaseDirectory | Out-Null
            gh release download $tag --repo $env:APPS_REPO --pattern $zipName --pattern release.json --dir $existingReleaseDirectory
            if ($LASTEXITCODE -ne 0) { throw "无法下载既有 LVM 应用 Release 进行一致性校验。" }
            $remoteRelease = Get-Content -Raw -Encoding UTF8 (Join-Path $existingReleaseDirectory "release.json") | ConvertFrom-Json
            $remoteSha256 = (Get-FileHash (Join-Path $existingReleaseDirectory $zipName) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($remoteRelease.appId -ne $localRelease.appId -or
                $remoteRelease.version -ne $localRelease.version -or
                $remoteRelease.hostApiVersion -ne $localRelease.hostApiVersion -or
                $remoteRelease.minWorkbenchVersion -ne $localRelease.minWorkbenchVersion -or
                $remoteRelease.size -ne $localRelease.size -or
                $remoteRelease.sha256.ToLowerInvariant() -ne $localRelease.sha256.ToLowerInvariant() -or
                $remoteSha256 -ne $localRelease.sha256.ToLowerInvariant() -or
                $remoteRelease.signature.keyId -ne $localRelease.signature.keyId -or
                $remoteRelease.signature.signature -ne $localRelease.signature.signature) {
              throw "应用 Release 已存在但内容不一致，拒绝覆盖既有版本。"
            }
            Write-Output "既有 LVM 应用 Release 校验通过，保持版本不可变：$tag"
            exit 0
          }
          gh release create $tag $zipPath $releasePath --repo $env:APPS_REPO --title "LVM 缓存清理工具 $tag" --notes "工作台内嵌 LVM 缓存清理工具。" --latest
          if ($LASTEXITCODE -ne 0) {
            throw "LVM 工具应用 Release 创建失败。"
          }
          $catalogRoot = Join-Path $env:RUNNER_TEMP "hephaestus-app-catalog"
          gh repo clone $env:APPS_REPO $catalogRoot -- --depth=1
          if ($LASTEXITCODE -ne 0) { throw "应用目录仓库检出失败。" }
          node tools/update-app-catalog.mjs (Join-Path $catalogRoot "catalog.json") (Join-Path $PWD "apps/lvm-uncache-tool/dist/release.json") (Join-Path $PWD "apps/lvm-uncache-tool/manifest.json")
          Push-Location $catalogRoot
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git commit -m "发布 lvm-uncache-tool@$($manifest.version)"
          gh auth setup-git
          git push
          Pop-Location
